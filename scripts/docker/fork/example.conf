# example config for the copyparty-fork docker image;
# copy this into your /cfg folder (any name ending with .conf),
# change the password, and restart the container

[global]
  e2dsa  # index files, enables search and upload-undo

  # server commands for the >_ tab (admins only); one per line,
  # never run through a shell; see --help-wcmd
  wcmd: dl=aria2c --dir={dir} -- {arg}
  wcmd: ytdl=yt-dlp --no-progress -P {dir} -- {arg}
  wcmd: ytmp3=yt-dlp --no-progress -x --audio-format mp3 -P {dir} -- {arg}
  wcmd: 7z=7z x -y -o{dst} -- {src}
  wcmd: ytdl-update=yt-dlp -U

[accounts]
  admin: CHANGEME

[/]
  /w
  accs:
    A: admin
